name: 打包Highlight
on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 安装 vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          packages: ffmpeg
          triplet: x64-windows

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust缓存加速
        uses: swatinem/rust-cache@v2

      - name: 进入app目录，安装前端依赖
        working-directory: ./app
        run: npm ci

      - name: Tauri打包
        working-directory: ./app
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: npm run tauri build -- --no-sign

      - name: 上传打包产物
        uses: actions/upload-artifact@v4
        with:
          name: Highlight-打包结果
          path: app/src-tauri/target/release/bundle/**/*
