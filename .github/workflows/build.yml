name: 打包Highlight
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      FFMPEG_SYS_NEXT_DEBUG: "1"
      RUST_BACKTRACE: "1"
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            nasm
            make
            pkgconf

      - name: 清理vendor/ffmpeg
        run: |
          if (Test-Path vendor/ffmpeg) {
            Remove-Item -Recurse -Force vendor/ffmpeg
          }

      - name: 安装Rust + GNU目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Rust缓存加速
        uses: swatinem/rust-cache@v2

      - name: 预校验Rust代码（触发ffmpeg-sys-next编译）
        working-directory: ./app
        run: cargo check --target x86_64-pc-windows-gnu

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 进入app目录，安装前端依赖
        working-directory: ./app
        run: npm ci

      - name: Tauri打包 GNU
        working-directory: ./app
        run: npm run tauri build -- --target x86_64-pc-windows-gnu --no-sign

      - name: 上传打包产物
        uses: actions/upload-artifact@v4
        with:
          name: Highlight-打包结果-GNU
          path: app/src-tauri/target/x86_64-pc-windows-gnu/release/bundle/**/*
