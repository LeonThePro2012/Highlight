name: 打包Highlight
on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      FFMPEG_SYS_NEXT_DEBUG: "1"
      RUST_BACKTRACE: "1"
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      # ✅ 优先安装 MSYS2，补齐 sh、nasm、make（ffmpeg configure 必须）
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            nasm
            make

      # 清理vendor/ffmpeg
      - name: 清理vendor/ffmpeg
        run: |
          if (Test-Path vendor/ffmpeg) {
            Remove-Item -Recurse -Force vendor/ffmpeg
          }

      - name: 安装Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust缓存加速
        uses: swatinem/rust-cache@v2

      - name: 预校验Rust代码（触发ffmpeg-sys-next编译）
        working-directory: ./app
        run: cargo check

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 进入app目录，安装前端依赖
        working-directory: ./app
        run: npm ci

      - name: Tauri打包
        working-directory: ./app
        run: npm run tauri build -- --no-sign

      - name: 上传打包产物
        uses: actions/upload-artifact@v4
        with:
          name: Highlight-打包结果
          path: app/src-tauri/target/release/bundle/**/*
