name: 打包Highlight
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 cross
        uses: taiki-e/install-action@cross

      - name: 缓存编译产物
        uses: actions/cache@v4
        with:
          path: ~/.target
          key: cross-${{ hashFiles('Cargo.toml','Cargo.lock') }}

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 前端依赖
        working-directory: ./app
        run: npm ci

      - name: cross 编译 release
        working-directory: ./app
        run: cross build --target x86_64-pc-windows-gnu --release
        env:
          # 不需要签名，这两行注释保留不动即可
          # TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          # TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: 上传打包产物
        uses: actions/upload-artifact@v4
        with:
          name: Highlight-Windows-GNU
          path: app/src-tauri/target/x86_64-pc-windows-gnu/release/bundle/**
